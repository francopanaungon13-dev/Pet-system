
<html>
<head>
<script src="shared-storage.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Paws - Pet Information</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eaf5ff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .box {
      width: 370px;
      max-width: 90%;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }

    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }

    .logo {
      font-size: 35px;
    }

    .title {
      color: #064de8;
      font-size: 16px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
    }

    .form {
      padding: 20px;
    }

    h3 {
      font-size: 15px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    label {
      font-size: 11px;
      color: #777;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      height: 32px;
      border: 0;
      background: #d8eafb;
      border-radius: 5px;
      padding: 5px;
      font-family: Arial, sans-serif;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      border: 0;
      background: #6caee5;
      color: white;
      padding: 10px 16px;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .btn:hover {
      background: #087cff;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Pet Information</div>
    </div>

    <form class="form" id="petForm">
      <h3>Pet Information</h3>

      <div class="grid">
        <div>
          <label for="petName">Pet Name</label>
          <input type="text" id="petName" required>
        </div>

        <div>
          <label for="petType">Pet Type</label>
          <select id="petType" required>
            <option value="">Select</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Bird">Bird</option>
            <option value="Rabbit">Rabbit</option>
          </select>
        </div>

        <div>
          <label for="breed">Breed</label>
          <input type="text" id="breed" required>
        </div>

        <div>
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required>
        </div>

        <div>
          <label for="color">Color / Markings</label>
          <input type="text" id="color" required>
        </div>
      </div>

      <div class="buttons">
        <a href="owner.html" class="btn">← Back</a>
        <button type="submit" class="btn">Finish ✓</button>
      </div>
    </form>
  </div>

  <script>
    const petForm = document.getElementById("petForm");

    petForm.addEventListener("submit", function(e) {
      e.preventDefault();

      let users = [];

      try {
        users = JSON.parse(localStorage.getItem("happyPawsUsers") || "[]");
      } catch (error) {
        alert("Unable to read owner information. Please register again.");
        return;
      }

      const email = localStorage.getItem("currentUserEmail");

      const user = users.find(function(item) {
        return item.email === email;
      });

      if (!user) {
        alert("Please register or log in first.");
        window.location.href = "index.html";
        return;
      }

      const pet = {
        id: Date.now().toString(),
        name: document.getElementById("petName").value.trim(),
        type: document.getElementById("petType").value,
        breed: document.getElementById("breed").value.trim(),
        gender: document.getElementById("gender").value,
        dob: document.getElementById("dob").value,
        color: document.getElementById("color").value.trim(),
        ownerName: ((user.firstName || "") + " " + (user.lastName || "")).trim(),
        ownerEmail: user.email
      };

      if (
        !pet.name ||
        !pet.type ||
        !pet.breed ||
        !pet.gender ||
        !pet.dob ||
        !pet.color
      ) {
        alert("Please complete all pet information.");
        return;
      }

      if (new Date(pet.dob + "T00:00:00") > new Date()) {
        alert("Date of Birth cannot be in the future.");
        return;
      }

      if (!Array.isArray(user.pets)) {
        user.pets = [];
      }

      user.pets.push(pet);

      try {
        localStorage.setItem("happyPawsUsers", JSON.stringify(users));

        let savedPets = [];

        try {
          savedPets = JSON.parse(localStorage.getItem("happyPawsPets") || "[]");

          if (!Array.isArray(savedPets)) {
            savedPets = [];
          }
        } catch (error) {
          savedPets = [];
        }

        savedPets.push(pet);

        localStorage.setItem("happyPawsPets", JSON.stringify(savedPets));

        alert("Pet information saved successfully!");
        window.location.href = "records.html";
      } catch (error) {
        user.pets.pop();
        alert("Unable to save pet information. Please try again.");
      }
    });
  </script>
</body>
</html>
