<html>
<head>
  <title>Happy Paws - Owner</title>
  <style>
    body {
      font-family: Arial;
      background: #eaf5ff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      width: 370px;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }
    .logo {
      font-size: 35px;
    }
    .title {
      color: #064de8;
      font-size: 12px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 8px;
      color: #888;
    }
    .form {
      padding: 20px;
    }
    h3 {
      font-size: 13px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    label {
      font-size: 8px;
      color: #777;
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      height: 25px;
      border: 0;
      background: #d8eafb;
      border-radius: 5px;
      padding: 4px;
      box-sizing: border-box;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    button {
      border: 0;
      background: #6caee5;
      color: white;
      padding: 8px 14px;
      border-radius: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Owner Information</div>
    </div>

    <form class="form" id="ownerForm">
      <h3>Owner Information</h3>

      <div class="grid">
        <div>
          <label>Address</label>
          <input type="text" id="address" required>
        </div>
        <div>
          <label>Date of Birth</label>
          <input type="date" id="dob" required>
        </div>

        <div>
          <label>Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div>
          <label>ID Type</label>
          <select id="idType" required>
            <option value="">Select</option>
            <option>National ID</option>
            <option>Driver's License</option>
            <option>Passport</option>
          </select>
        </div>

        <div>
          <label>ID Number</label>
          <input type="text" id="idNumber" required>
        </div>
        <div>
          <label>Relationship to Pet</label>
          <input type="text" id="relationship" required>
        </div>
      </div>

      <div class="buttons">
        <button type="button" onclick="window.location.href='account.html'">← Back</button>
        <button type="submit">Next Step →</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('ownerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const ownerData = {
        address: document.getElementById('address').value,
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        idType: document.getElementById('idType').value,
        idNumber: document.getElementById('idNumber').value,
        relationship: document.getElementById('relationship').value
      };

      localStorage.setItem('ownerData', JSON.stringify(ownerData));
      window.location.href = 'pet.html';
    });
  </script>

</body>
</html>
