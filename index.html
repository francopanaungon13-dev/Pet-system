<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Paws - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eaf5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background */
    .background {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #e9f5ff, #ffffff);
      z-index: -1;
    }

    .paw {
      position: absolute;
      color: #b5d8f5;
      font-size: 35px;
      opacity: 0.75;
    }

    .paw1 {
      top: 70px;
      left: 55px;
    }

    .paw2 {
      top: 250px;
      left: 25px;
    }

    .paw3 {
      right: 40px;
      top: 70px;
    }

    .paw4 {
      right: 25px;
      bottom: 70px;
    }

    /* Main Card */
    .container {
      width: 365px;
      min-height: 360px;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      box-shadow: 0 7px 15px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* Header */
    .header {
      height: 135px;
      background: #dff3f5;
      text-align: center;
      padding-top: 10px;
    }

    .logo {
      width: 45px;
      height: 45px;
      margin: 0 auto 5px;
      border: 3px solid #2563eb;
      border-radius: 50%;
      position: relative;
    }

    .logo::before {
      content: "🐾";
      font-size: 32px;
      position: absolute;
      left: 2px;
      top: 0px;
    }

    .title {
      color: #064de8;
      font-size: 11px;
      font-weight: bold;
      margin-top: 5px;
    }

    .subtitle {
      color: #8ca0ad;
      font-size: 7px;
      margin-top: 4px;
    }

    /* Steps */
    .steps {
      width: 240px;
      margin: 15px auto 0;
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    .steps::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 12px;
      right: 12px;
      height: 5px;
      background: #79cad5;
      border-radius: 10px;
      z-index: 0;
    }

    .step {
      position: relative;
      z-index: 1;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1px solid #777;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #333;
    }

    .step.active {
      background: #b6e4e8;
    }

    .step-label {
      position: absolute;
      top: 23px;
      width: 70px;
      left: -25px;
      font-size: 7px;
      font-weight: bold;
    }

    /* Form */
    .form-area {
      padding: 20px 16px 15px;
    }

    .form-title {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid #777;
      margin-bottom: 10px;
    }

    .person-icon {
      font-size: 23px;
    }

    .form-title h2 {
      font-size: 12px;
      color: #111;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .field label {
      display: block;
      font-size: 7px;
      color: #777;
      margin-bottom: 4px;
    }

    .input-box {
      width: 100%;
      height: 17px;
      border: none;
      outline: none;
      background: #d8eafb;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 8px;
      color: #333;
    }

    .input-box:focus {
      box-shadow: 0 0 0 1px #1683ff;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .input-box {
      padding-right: 25px;
    }

    .eye {
      position: absolute;
      right: 6px;
      top: 3px;
      font-size: 9px;
      cursor: pointer;
      color: #777;
    }

    /* Button */
    .button-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .next-btn {
      border: none;
      background: #6caee5;
      color: white;
      padding: 7px 13px;
      border-radius: 15px;
      font-size: 9px;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    .next-btn:hover {
      background: #428fd0;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .container {
        width: 92%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .header {
        height: 145px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="paw paw1">🐾</div>
    <div class="paw paw2">🐾</div>
    <div class="paw paw3">🐾</div>
    <div class="paw paw4">🐾</div>
  </div>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="logo"></div>

      <div class="title">
        Create Your Happy Paws Account!
      </div>

      <div class="subtitle">
        Complete your registration for expert pet care services
      </div>

      <!-- STEPS -->
      <div class="steps">

        <div class="step active">
          1
          <span class="step-label">Account</span>
        </div>

        <div class="step">
          2
          <span class="step-label">Owner Info</span>
        </div>

        <div class="step">
          3
          <span class="step-label">Pet Info</span>
        </div>

      </div>
    </div>

    <!-- FORM -->
    <div class="form-area">

      <div class="form-title">
        <span class="person-icon">♙</span>
        <h2>Account Information</h2>
      </div>

      <div class="form-grid">

        <!-- First Name -->
        <div class="field">
          <label>First Name</label>
          <input
            type="text"
            class="input-box"
            id="firstName"
          >
        </div>

        <!-- Last Name -->
        <div class="field">
          <label>Last Name</label>
          <input
            type="text"
            class="input-box"
            id="lastName"
          >
        </div>

        <!-- Email -->
        <div class="field">
          <label>Email Address</label>
          <input
            type="email"
            class="input-box"
            id="email"
          >
        </div>

        <!-- Phone -->
        <div class="field">
          <label>Phone Number</label>
          <input
            type="tel"
            class="input-box"
            id="phone"
          >
        </div>

        <!-- Password -->
        <div class="field">
          <label>Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              class="input-box"
              id="password"
            >

            <span
              class="eye"
              onclick="togglePassword('password', this)"
            >◉</span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label>Confirm Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              class="input-box"
              id="confirmPassword"
            >

            <span
              class="eye"
              onclick="togglePassword('confirmPassword', this)"
            >◉</span>
          </div>
        </div>

      </div>

      <!-- BUTTON -->
      <div class="button-area">
        <button
          class="next-btn"
          onclick="nextStep()"
        >
          Next Step →
        </button>
      </div>

    </div>

  </div>


  <script>

    function togglePassword(id, icon) {

      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "◉";
      } else {
        input.type = "password";
        icon.textContent = "◉";
      }

    }


    function nextStep() {

      const firstName =
        document.getElementById("firstName").value.trim();

      const lastName =
        document.getElementById("lastName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (
        !firstName ||
        !lastName ||
        !email ||
        !phone ||
        !password ||
        !confirmPassword
      ) {
        alert("Please complete all fields.");
        return;
      }


      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }


      alert("Account information completed!");

      // Next page can be added here
      // window.location.href = "owner-info.html";
    }

  </script>

</body>
</html>
