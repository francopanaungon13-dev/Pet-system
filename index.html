
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Paws - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf5ff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 370px;
            max-width: 100%;
            background: white;
            border: 2px solid #087cff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 25px #b8d6ee;
        }

        .header {
            background: #dff3f5;
            text-align: center;
            padding: 25px 15px;
        }

        .logo {
            font-size: 42px;
        }

        .header h1 {
            color: #064de8;
            margin: 8px 0;
            font-size: 28px;
        }

        .header p {
            color: #667788;
            margin: 0;
            font-size: 13px;
        }

        .content {
            padding: 25px;
        }

        .content h2 {
            color: #12385a;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #12385a;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b9d4e8;
            border-radius: 7px;
            background: #f5faff;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087cff;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 22px;
        }

        button:hover {
            background: #0565d2;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .register-button {
            display: block;
            width: 100%;
            padding: 13px;
            background: #ffffff;
            color: #087cff;
            border: 2px solid #087cff;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
        }

        .register-button:hover {
            background: #ebf8ff;
        }

        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #778899;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="header">
            <div class="logo">🐾</div>
            <h1>Happy Paws</h1>
            <p>PET CLINIC ADMIN PORTAL</p>
        </div>

        <div class="content">
            <h2>Admin Login</h2>
            <p class="subtitle">Sign in to manage your clinic.</p>

            <form id="adminLoginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">LOGIN</button>

                <p id="errorMessage" class="error" role="alert"></p>
            </form>

            <a href="admin.html" class="register-button">
                ➕ NEW OWNER REGISTRATION
            </a>

            <div class="footer">
                Authorized clinic personnel only
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAuA61e2n9AdWa7TQoY9zxZCcgV2oqdB0",
            authDomain: "happy-paws-76fe1.firebaseapp.com",
            projectId: "happy-paws-76fe1",
            storageBucket: "happy-paws-76fe1.firebasestorage.app",
            messagingSenderId: "28434805127",
            appId: "1:28434805127:web:599623fa363ef70c512322",
            measurementId: "G-FDX0YQFRTP"
        };

        const ADMIN_UID = "tlbbUkr7F8Y6XQLU0jm5dldigNo1";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("adminLoginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");

        let checkingLogin = true;

        onAuthStateChanged(auth, async function(user) {
            if (user && user.uid === ADMIN_UID) {
                sessionStorage.setItem("happyPawsAdminLoggedIn", "true");
                window.location.replace("dashboard.html");
                return;
            }

            if (user) {
                await signOut(auth);
            }

            sessionStorage.removeItem("happyPawsAdminLoggedIn");
            checkingLogin = false;
        });

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            if (checkingLogin) {
                errorMessage.textContent =
                    "Please wait while authentication is checked.";
                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            errorMessage.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "PLEASE WAIT...";

            try {
                const result = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                if (result.user.uid !== ADMIN_UID) {
                    await signOut(auth);

                    throw new Error(
                        "This account is not authorized as the clinic Admin."
                    );
                }

                sessionStorage.setItem("happyPawsAdminLoggedIn", "true");
                window.location.replace("dashboard.html");

            } catch (error) {
                sessionStorage.removeItem("happyPawsAdminLoggedIn");

                if (error.code === "auth/invalid-credential" ||
                    error.code === "auth/user-not-found" ||
                    error.code === "auth/wrong-password") {
                    errorMessage.textContent =
                        "Incorrect email or password.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage.textContent =
                        "Please enter a valid email address.";
                } else if (error.code === "auth/too-many-requests") {
                    errorMessage.textContent =
                        "Too many attempts. Please try again later.";
                } else if (error.code === "auth/network-request-failed") {
                    errorMessage.textContent =
                        "Network error. Check your internet connection.";
                } else {
                    errorMessage.textContent =
                        error.message || "Unable to log in. Please try again.";
                }
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "LOGIN";
            }
        });
    </script>
</body>
</html>
