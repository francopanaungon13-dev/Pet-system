<html>
<head>
  <title>Happy Paws - Account</title>
  <meta http-equiv="refresh" content="0;url=admin.html">
  <style>
    body {
      font-family: Arial;
      background: #eaf5ff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      width: 370px;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }
    .logo {
      font-size: 35px;
    }
    .title {
      color: #064de8;
      font-size: 12px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 8px;
      color: #888;
    }
    .form {
      padding: 20px;
    }
    h3 {
      font-size: 13px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    label {
      font-size: 8px;
      color: #777;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      height: 25px;
      border: none;
      background: #d8eafb;
      border-radius: 5px;
      padding: 4px;
      box-sizing: border-box;
    }
    .buttons {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }
    button {
      border: none;
      background: #064de8;
      color: white;
      padding: 8px 14px;
      border-radius: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #0438a8;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Create Your Happy Paws Account!</div>
      <div class="subtitle">Complete your registration for expert pet care services</div>
    </div>

    <form class="form" id="accountForm">
      <h3>Account Information</h3>

      <div class="grid">
        <div>
          <label>First Name</label>
          <input type="text" id="firstName" required>
        </div>
        <div>
          <label>Last Name</label>
          <input type="text" id="lastName" required>
        </div>
        <div>
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label>Phone Number</label>
          <input type="text" id="phone" required>
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <div>
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
      </div>

      <div class="buttons">
        <button type="submit">Next Step →</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("accountForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      let users = JSON.parse(localStorage.getItem("happyPawsUsers") || "[]");

      if (users.some(user => user.email === email)) {
        alert("Email already registered. Please use another email.");
        return;
      }

      const account = {
        id: Date.now().toString(),
        firstName: firstName,
        lastName: lastName,
        email: email,
        phone: phone,
        password: password,
        owner: {},
        pets: []
      };

      users.push(account);

      try {
        localStorage.setItem("happyPawsUsers", JSON.stringify(users));
        localStorage.setItem("currentUserEmail", email);
        window.location.href = "owner.html";
      } catch (error) {
        alert("Unable to save registration in this browser.");
      }
    });
  </script>

</body>
</html>
