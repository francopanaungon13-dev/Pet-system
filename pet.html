<html>
<head>
  <title>Happy Paws - Pet Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf5ff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 370px;
      max-width: 90%;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }

    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }

    .logo {
      font-size: 35px;
    }

    .title {
      color: #064de8;
      font-size: 16px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
    }

    .form {
      padding: 20px;
    }

    h3 {
      font-size: 15px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    label {
      font-size: 11px;
      color: #777;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      height: 32px;
      border: 0;
      background: #d8eafb;
      border-radius: 5px;
      padding: 5px;
      box-sizing: border-box;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 22px;
    }

    .btn {
      border: 0;
      background: #6caee5;
      color: white;
      padding: 10px 16px;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }

    .btn:hover {
      background: #087cff;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Pet Information</div>
    </div>

    <form class="form" id="petForm">
      <h3>Pet Information</h3>

      <div class="grid">
        <div>
          <label for="petName">Pet Name</label>
          <input type="text" id="petName" required>
        </div>

        <div>
          <label for="petType">Pet Type</label>
          <select id="petType" required>
            <option value="">Select</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div>
          <label for="breed">Breed</label>
          <input type="text" id="breed" required>
        </div>

        <div>
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required>
        </div>

        <div>
          <label for="color">Color / Markings</label>
          <input type="text" id="color" required>
        </div>
      </div>

      <div class="buttons">
        <a href="owner.html" class="btn">← Back</a>
        <button type="submit" class="btn">Finish ✓</button>
      </div>
    </form>
  </div>

  <script>
  const petForm = document.getElementById("petForm");

if (petForm) {
    petForm.addEventListener("submit", function(e) {
        e.preventDefault();

        const email = localStorage.getItem("currentUserEmail");
        const users = JSON.parse(localStorage.getItem("happyPawsUsers") || "[]");
        const user = users.find(item => item.email === email);

        if (!user) {
            alert("Please register or log in first.");
            window.location.href = "index.html";
            return;
        }

        const petName = document.getElementById("petName");
        const petType = document.getElementById("petType");
        const breed = document.getElementById("breed");
        const gender = document.getElementById("gender");
        const dob = document.getElementById("dob");
        const color = document.getElementById("color");

        if (!petName || !petType || !breed || !gender || !dob || !color) {
            alert("May input ID na hindi tugma sa pet.html. Pakisuri ang IDs.");
            return;
        }

        const pet = {
            id: Date.now(),
            name: petName.value.trim(),
            type: petType.value,
            breed: breed.value.trim(),
            gender: gender.value,
            dob: dob.value,
            color: color.value.trim()
        };

        if (!pet.name || !pet.type) {
            alert("Please enter the pet name and type.");
            return;
        }

        if (!Array.isArray(user.pets)) {
            user.pets = [];
        }

        user.pets.push(pet);

        localStorage.setItem("happyPawsUsers", JSON.stringify(users));

        alert("Pet information saved successfully!");
        window.location.href = "dashboard.html";
    });
} else {
    alert("Hindi makita ang petForm. Pakisuri ang ID ng form sa pet.html.");
}
  </script>
</body>
</html>
