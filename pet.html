<head>

  <style>

      border: 0;

      padding: 10px 16px;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }

      background: #087cff;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Pet Information</div>
    </div>

    <form class="form" id="petForm">
      <h3>Pet Information</h3>

      <div class="grid">
        <div>
          <label for="petName">Pet Name</label>
          <input type="text" id="petName" required>
        </div>

        <div>
          <label for="petType">Pet Type</label>
          <select id="petType" required>
            <option value="">Select</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div>
          <label for="breed">Breed</label>
          <input type="text" id="breed" required>
        </div>

        <div>
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required>
        </div>

        <div>
          <label for="color">Color / Markings</label>
          <input type="text" id="color" required>
        </div>
      </div>

      <div class="buttons">
        <a href="owner.html" class="btn">← Back</a>
        <button type="submit" class="btn">Finish ✓</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("petForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const pet = {
        name: document.getElementById("petName").value,
        type: document.getElementById("petType").value,
        breed: document.getElementById("breed").value,
        gender: document.getElementById("gender").value,
        dob: document.getElementById("dob").value,
        color: document.getElementById("color").value
      };

      try {
        localStorage.setItem("petInformation", JSON.stringify(pet));
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Unable to save pet information in this browser.");
      }
    });
  </script>
</body>
</html>
