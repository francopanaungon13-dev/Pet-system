<html>
<head>
  <title>Happy Paws - Pet</title>
  <style>
    body {
      font-family: Arial;
      background: #eaf5ff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      width: 370px;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }
    .logo {
      font-size: 35px;
    }
    .title {
      color: #064de8;
      font-size: 12px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 8px;
      color: #888;
    }
    .form {
      padding: 20px;
    }
    h3 {
      font-size: 13px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    label {
      font-size: 8px;
      color: #777;
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      height: 25px;
      border: 0;
      background: #d8eafb;
      border-radius: 5px;
      padding: 4px;
      box-sizing: border-box;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    /* Ito ang magpapamukhang tunay na button sa mga link tags */
    .btn {
      border: 0;
      background: #6caee5;
      color: white;
      padding: 8px 14px;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
      text-align: center;
    }
    .btn:hover {
      background: #5a9bd2;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Pet Information</div>
    </div>

    <div class="form">
      <h3>Pet Information</h3>

      <div class="grid">
        <div>
          <label>Pet Name</label>
          <input type="text">
        </div>

        <div>
          <label>Pet Type</label>
          <select>
            <option>Select</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div>
          <label>Breed</label>
          <input type="text">
        </div>

        <div>
          <label>Gender</label>
          <select>
            <option>Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div>
          <label>Date of Birth</label>
          <input type="date">
        </div>

        <div>
          <label>Color / Markings</label>
          <input type="text">
        </div>
      </div>

      <div class="buttons">
        <a href="owner.html" class="btn">← Back</a>
        <a href="dashboard.html" class="btn">Finish ✓</a>
      </div>
    </div>
  </div>

</body>
</html>
