<!DOCTYPE html>
<html>
<head>
  <title>Happy Paws - Pet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf5ff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 370px;
      background: white;
      border: 2px solid #087cff;
      border-radius: 12px;
      overflow: hidden;
    }

    .header {
      background: #dff3f5;
      text-align: center;
      padding: 15px;
    }

    .logo {
      font-size: 35px;
    }

    .title {
      color: #064de8;
      font-size: 12px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 8px;
      color: #888;
    }

    .form {
      padding: 20px;
    }

    h3 {
      font-size: 13px;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    label {
      font-size: 8px;
      color: #777;
      display: block;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      height: 30px;
      border: 0;
      background: #d8eafb;
      border-radius: 5px;
      padding: 5px;
      box-sizing: border-box;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      border: 0;
      background: #6caee5;
      color: white;
      padding: 8px 14px;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
      display: inline-block;
    }

    .btn:hover {
      background: #087cff;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="header">
      <div class="logo">🐾</div>
      <div class="title">Happy Paws</div>
      <div class="subtitle">Pet Information</div>
    </div>

    <form class="form" id="petForm">

      <h3>Pet Information</h3>

      <div class="grid">

        <div>
          <label for="petName">Pet Name</label>
          <input type="text" id="petName" name="petName" required>
        </div>

        <div>
          <label for="petType">Pet Type</label>
          <select id="petType" name="petType" required>
            <option value="">Select</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Bird">Bird</option>
            <option value="Rabbit">Rabbit</option>
          </select>
        </div>

        <div>
          <label for="breed">Breed</label>
          <input type="text" id="breed" name="breed" required>
        </div>

        <div>
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <div>
          <label for="color">Color / Markings</label>
          <input type="text" id="color" name="color" required>
        </div>

      </div>

      <div class="buttons">
        <a href="owner.html" class="btn">← Back</a>

        <button type="submit" class="btn">
          Finish ✓
        </button>
      </div>

    </form>

  </div>

  <script>
    document.getElementById("petForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Save pet information in the browser
      const pet = {
        name: document.getElementById("petName").value,
        type: document.getElementById("petType").value,
        breed: document.getElementById("breed").value,
        gender: document.getElementById("gender").value,
        dob: document.getElementById("dob").value,
        color: document.getElementById("color").value
      };

      localStorage.setItem("petInformation", JSON.stringify(pet));

      // Go to dashboard
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
